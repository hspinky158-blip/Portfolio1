<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><title>Portfolio Account Executive</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700;800&amp;family=Be+Vietnam+Pro:wght@300;400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Mrs+Saint+Delafield&amp;display=swap">
</head><body>
<style id="css">
/* Layout (after Neiden): handwritten loader → particle-wave hero with giant wordmark + script → framed light sections with word-reveal statement, scroll timeline, stacked cards → dark blur-focus project reel → expanding gradient block → contact + marquee footer */
:root{
  --bg:#FFFFFF; --bg-2:#F4F4F2; --ink:#0E0E10; --ink-2:#3C3C43; --muted:#8B8B93; --faint:#D2D2D7; --line:rgba(14,14,16,.09);
  --dark:#0E0E10; --dark-2:#19191C; --on-dark:#F4F4F5; --on-dark-2:#9A9AA3; --line-d:rgba(255,255,255,.1);
  --grad:linear-gradient(100deg,#6A5CFF 0%,#A866FF 34%,#FF6FA8 68%,#FFA978 100%);
  --g1:#6A5CFF; --g2:#FF6FA8; --p1:#6A5CFF; --p2:#A866FF; --p3:#FF6FA8; --p4:#FFA978;
  --f-display:"Epilogue","Helvetica Neue",Arial,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-script:"Mrs Saint Delafield","Brush Script MT",cursive;
  --ease:cubic-bezier(.16,1,.3,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --wrap:1200px;
  color-scheme:light;
}
/* Single bright look by design (white sections + one dark project reel); it keeps its own palette on any host theme. */

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:95;background:var(--bg)}
body.lock{overflow:hidden}
[hidden]{display:none!important}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--g1);outline-offset:3px}
::selection{background:#E8E2FF}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1;text-wrap:balance}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.cap{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.mono{font-family:var(--f-mono)}

/* framed guides like the reference */
.frame{position:relative}
.frame::before{content:"";position:absolute;top:0;bottom:0;left:max(20px,calc((100% - var(--wrap))/2 + 20px));right:max(20px,calc((100% - var(--wrap))/2 + 20px));border-inline:1px solid var(--line);pointer-events:none}
.dark.frame::before{border-color:var(--line-d)}
.cdot{position:absolute;width:5px;height:5px;background:var(--ink);border-radius:1px;z-index:1}
.dark .cdot{background:var(--on-dark)}

/* section tag */
.tag{display:inline-flex;align-items:center;gap:12px;font-size:13px;font-weight:500;letter-spacing:.02em;text-transform:uppercase;color:var(--ink)}
.tag .pills{display:inline-flex;gap:2px}
.tag .pills i{width:8px;height:12px;border-radius:6px 2px 2px 6px;background:var(--p3)}
.tag .pills i:nth-child(1){background:var(--p1);border-radius:6px}
.tag .pills i:nth-child(2){background:var(--p2)}
.tag .pills i:nth-child(4){background:var(--p4)}
.tag em{font-style:normal;color:var(--muted)}
.dark .tag{color:var(--on-dark)}
.dark .tag em{color:var(--on-dark-2)}

/* ---------- LOADER ---------- */
.loader{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;transition:transform 1s var(--ease),visibility 0s 1s}
.loader.done{transform:translateY(-100%);visibility:hidden}
.loader svg{width:min(560px,86vw);overflow:visible}
.loader text{font-family:var(--f-script);font-size:96px;fill:transparent;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:1400;stroke-dashoffset:1400;animation:write 1.7s .2s cubic-bezier(.6,0,.3,1) forwards,fillin .5s 1.4s forwards}
@keyframes write{to{stroke-dashoffset:0}}
@keyframes fillin{to{fill:var(--ink)}}
.loader .lb{position:absolute;bottom:calc(48px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;letter-spacing:-.03em;font-size:20px;opacity:0;animation:inup .8s .3s var(--ease) forwards}
.loader .lb i{width:28px;height:28px;border-radius:8px;background:var(--grad);display:grid;place-items:center;color:#fff;font-style:normal;font-size:13px}
.loader .count{position:absolute;right:max(24px,env(safe-area-inset-right,0px));bottom:calc(48px + env(safe-area-inset-bottom,0px));font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
@keyframes inup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ---------- TOP BAR / MENU ---------- */
.mbtn{position:fixed;z-index:120;top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));width:46px;height:46px;border:0;background:var(--ink);color:#fff;cursor:pointer;display:grid;place-items:center;transition:transform .4s var(--ease)}
.mbtn span{display:block;width:18px;height:1.6px;background:currentColor;transition:transform .5s var(--ease),width .4s var(--ease)}
.mbtn span+span{margin-top:5px;width:12px;margin-left:6px}
.mbtn:hover span+span{width:18px;margin-left:0}
.mbtn[aria-expanded="true"]{background:#fff;color:var(--ink)}
.mbtn[aria-expanded="true"] span:first-child{transform:translateY(3.3px) rotate(45deg)}
.mbtn[aria-expanded="true"] span+span{width:18px;margin-left:0;transform:translateY(-3.3px) rotate(-45deg)}
.menu{position:fixed;inset:0;z-index:110;background:var(--dark);color:var(--on-dark);display:flex;flex-direction:column;justify-content:space-between;gap:30px;padding:calc(90px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));clip-path:inset(0 0 100% 0);transition:clip-path .9s var(--ease);visibility:hidden;overflow:auto}
.menu.open{clip-path:inset(0 0 0 0);visibility:visible}
.menu nav{display:grid;gap:2px;max-width:var(--wrap);width:100%;margin:0 auto}
.menu nav a{display:flex;align-items:baseline;gap:16px;font-family:var(--f-display);font-weight:700;font-size:clamp(40px,7vw,88px);letter-spacing:-.05em;line-height:1.05;transform:translateY(40px);opacity:0;transition:transform .9s var(--ease),opacity .6s,color .3s}
.menu nav a small{font-family:var(--f-mono);font-size:12px;letter-spacing:0;color:var(--on-dark-2);font-weight:400}
.menu nav a:hover{color:transparent;background:var(--grad);-webkit-background-clip:text;background-clip:text}
.menu.open nav a{transform:none;opacity:1}
.menu .mf{max-width:var(--wrap);width:100%;margin:0 auto;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--on-dark-2);font-size:14px}
.menu .mf a{color:var(--on-dark)}

/* sticky bottom CTA */
.dock{position:fixed;z-index:100;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);display:flex;gap:6px;transition:transform .7s var(--ease)}
.dock.on{transform:translate(-50%,0)}
.dock a,.dock button{height:48px;display:inline-flex;align-items:center;gap:10px;padding:0 22px;background:var(--ink);color:#fff;border:0;cursor:pointer;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.dock a span{color:#A1A1AA;font-weight:500}
.dock a i{width:8px;height:8px;border-radius:50%;background:#2BD38F;box-shadow:0 0 0 0 rgba(43,211,143,.6);animation:ping 2s infinite}
.dock button{width:48px;padding:0;justify-content:center;background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
@keyframes ping{70%{box-shadow:0 0 0 9px rgba(43,211,143,0)}}

/* ---------- HERO ---------- */
.hero{position:relative;overflow:hidden;isolation:isolate;padding-top:calc(16px + env(safe-area-inset-top,0px))}
#wave{position:absolute;left:0;right:0;bottom:0;height:78%;width:100%;z-index:-1;pointer-events:none}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:120px;background:linear-gradient(transparent,var(--bg));z-index:-1}
.hbar{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:46px;padding-right:56px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.03em}
.logo i{width:30px;height:30px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;font-style:normal;font-size:14px;font-weight:800;position:relative;overflow:hidden}
.logo i::after{content:"";position:absolute;inset:0;background:var(--grad);opacity:0;transition:opacity .4s}
.logo:hover i::after{opacity:1}
.logo i b{position:relative;z-index:1}
.logo sup{font-size:10px;color:var(--muted)}
.avail{display:flex;align-items:center;gap:10px;justify-content:center;margin:clamp(30px,6vw,64px) 0 0;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);flex-wrap:wrap}
.bars{display:inline-flex;gap:3px}
.bars i{width:5px;height:16px;background:var(--faint);transform-origin:bottom}
.bars i.on{background:var(--grad);background-size:500% 100%}
.bars i.on:nth-child(2){background-position:25% 0}.bars i.on:nth-child(3){background-position:50% 0}.bars i.on:nth-child(4){background-position:75% 0}.bars i.on:nth-child(5){background-position:100% 0}
.ready .bars i{animation:barup .6s var(--spring) backwards}
.bars i:nth-child(2){animation-delay:.05s!important}.bars i:nth-child(3){animation-delay:.1s!important}.bars i:nth-child(4){animation-delay:.15s!important}.bars i:nth-child(5){animation-delay:.2s!important}
@keyframes barup{from{transform:scaleY(0)}}
.htags{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:clamp(34px,5vw,60px)}
.htags div{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;line-height:1.35}
.htags div span{display:block;color:var(--muted);font-family:var(--f-mono);font-weight:400;font-size:11px;margin-bottom:4px}
.htags div:nth-child(2){text-align:center}.htags div:nth-child(3){text-align:right}
.wmwrap{position:relative;margin-top:clamp(14px,2vw,26px)}
.wm{display:inline-block;font-weight:800;letter-spacing:-.075em;line-height:.8;white-space:nowrap;font-size:20vw;padding-bottom:.03em}
.wm .l{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.05em;margin-bottom:-.05em}
.wm .l span{display:inline-block;transform:translateY(105%);transition:transform 1.2s var(--ease)}
.ready .wm .l span{transform:none}
.script{position:absolute;left:24%;top:46%;font-family:var(--f-script);font-weight:400;font-size:.36em;line-height:1;letter-spacing:0;white-space:nowrap;transform:rotate(-5deg);padding:.15em .35em .25em;clip-path:inset(0 100% 0 0);transition:clip-path 1.8s .9s cubic-bezier(.6,0,.2,1)}
.script span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.ready .script{clip-path:inset(0 0 0 0)}
.hbottom{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,80px);align-items:end;margin-top:clamp(28px,4vw,48px);padding-bottom:clamp(60px,9vw,120px)}
.hint{font-size:clamp(18px,1.8vw,24px);line-height:1.4;letter-spacing:-.01em;margin:0;max-width:30ch;font-weight:400}
.cta{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;height:64px;padding:0 24px;background:var(--ink);color:#fff;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;position:relative;overflow:hidden;isolation:isolate;border:0;cursor:pointer}
.cta::before{content:"";position:absolute;inset:0;background:var(--grad);z-index:-1;transform:scaleX(0);transform-origin:left;transition:transform .7s var(--ease)}
.cta:hover::before{transform:scaleX(1)}
.cta svg{transition:transform .6s var(--ease)}
.cta:hover svg{transform:rotate(90deg)}
.proof{display:flex;align-items:center;gap:16px;margin-top:18px;flex-wrap:wrap}
.avs{display:flex}
.avs span{width:44px;height:44px;border-radius:50%;border:2px solid var(--bg);margin-left:-12px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;overflow:hidden}
.avs span:first-child{margin-left:0}
.avs span img{width:100%;height:100%;object-fit:cover}
.avs span.more{background:var(--ink)}
.proof .rate{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;line-height:1.4}
.proof .rate .dots{display:inline-flex;gap:3px;margin-right:6px;vertical-align:middle}
.proof .rate .dots i{width:8px;height:8px;border-radius:50%;background:var(--grad)}
.proof .rate small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.hin{opacity:0;transform:translateY(24px);transition:opacity .9s var(--ease),transform 1.1s var(--ease)}
.ready .hin{opacity:1;transform:none}

/* ---------- BLOCKS ---------- */
.sec{padding-block:clamp(80px,11vw,150px)}
.shead{display:grid;gap:18px;margin-bottom:clamp(36px,5vw,64px)}
.shead h2{font-size:clamp(42px,7vw,104px);font-weight:700;letter-spacing:-.06em;line-height:.92}
.shead p{margin:0;max-width:48ch;color:var(--ink-2)}
.inner{position:relative;z-index:1;padding-inline:clamp(0px,3vw,40px)}

/* statement word reveal */
.statement{font-family:var(--f-display);font-weight:500;font-size:clamp(30px,4.6vw,64px);letter-spacing:-.045em;line-height:1.08;margin:28px 0 0;max-width:20ch}
.statement .w{transition:color .4s,filter .6s,opacity .6s}
.statement .w.dim{color:var(--faint);filter:blur(3px);opacity:.6}
.about-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(28px,5vw,80px);margin-top:clamp(40px,6vw,80px);align-items:start}
.about-photo{position:relative;aspect-ratio:4/5;background:var(--bg-2);overflow:hidden;border:0;padding:0;cursor:pointer;width:100%;display:block}
.about-photo img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--ease)}
.about-photo:hover img{transform:scale(1.04)}
.ph0{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:8px;text-align:center;background:var(--grad);color:#fff}
.ph0 b{font-family:var(--f-display);font-weight:800;font-size:clamp(80px,12vw,160px);letter-spacing:-.07em;line-height:.9}
.ph0 small{font-size:13px;opacity:.9}
.about-photo .swap{position:absolute;right:12px;bottom:12px;background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:8px 12px;opacity:0;transform:translateY(8px);transition:.4s var(--ease)}
.about-photo:hover .swap{opacity:1;transform:none}
.about-right{display:grid;gap:30px}
.about-right .lead{font-size:16px;color:var(--ink-2);max-width:52ch;margin:0}
.quote{border-top:1px solid var(--line);padding-top:24px;display:flex;gap:14px;align-items:center}
.quote .av{width:52px;height:52px;border-radius:50%;flex:none;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:700;overflow:hidden}
.quote .av img{width:100%;height:100%;object-fit:cover}
.quote b{display:block;font-weight:600}
.quote small{color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line)}
.kv div{padding:16px 0;border-bottom:1px solid var(--line);display:grid;gap:2px}
.kv div:nth-child(odd){padding-right:14px}
.kv div:nth-child(even){padding-left:14px;border-left:1px solid var(--line)}
.kv span{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kv b{font-weight:500;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;font-weight:500;padding:8px 13px;border:1px solid var(--line);background:var(--bg);transition:background .3s,color .3s,border-color .3s}
.chip:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn-line{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:14px 20px;border:1px solid var(--ink);transition:background .3s,color .3s}
.btn-line:hover{background:var(--ink);color:#fff}

/* journey timeline */
.journey{background:var(--bg-2)}
.tlx{position:relative;display:grid;gap:0;margin-top:20px}
.tlx .rail{position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--faint)}
.tlx .rail i{position:absolute;inset:0;background:linear-gradient(var(--g1),var(--g2));transform-origin:top;transform:scaleY(0)}
.tli{position:relative;display:grid;grid-template-columns:150px minmax(0,1fr);gap:24px;padding:28px 0 28px 34px;border-bottom:1px solid var(--line);transition:opacity .5s}
.tli::before{content:"";position:absolute;left:-4px;top:36px;width:10px;height:10px;background:var(--faint);transition:background .4s,transform .5s var(--spring)}
.tli.on::before{background:var(--g2);transform:scale(1.25)}
.tli.pre{opacity:.35}
.tli .when{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:4px}
.tli .kind{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;background:var(--bg);margin-bottom:10px}
.tli .kind.now{background:var(--ink);color:#fff}
.tli h4{font-size:clamp(22px,2.4vw,30px);font-weight:600;letter-spacing:-.04em;line-height:1.1}
.tli .org{font-weight:500;margin-top:6px;color:var(--ink-2)}
.tli p{margin:10px 0 0;color:var(--ink-2);max-width:60ch;font-size:15px}
.skills2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 40px;margin-top:clamp(50px,6vw,80px)}
.sk{display:grid;gap:8px}
.sk div{display:flex;justify-content:space-between;font-weight:500}
.sk div span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.sk .b{height:2px;background:var(--faint);position:relative}
.sk .b i{position:absolute;left:0;top:-1px;height:4px;width:var(--w);background:var(--grad);transform-origin:left;transition:transform 1.4s var(--ease)}

/* stacked cards (services + process) */
.stack{display:grid;gap:18px}
.scard{position:sticky;top:calc(80px + var(--i) * 14px + env(safe-area-inset-top,0px));transform-origin:top center;will-change:transform}
.svc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--bg);border:1px solid var(--line);min-height:min(560px,72vh);overflow:hidden}
.svc .vis{position:relative;overflow:hidden;min-height:260px;background:var(--bg-2)}
.svc .vis img{width:100%;height:100%;object-fit:cover}
.svc .txt{padding:clamp(24px,3vw,44px);display:flex;flex-direction:column;gap:20px;justify-content:space-between}
.svc .txt h3{font-size:clamp(30px,3.6vw,52px);font-weight:700;letter-spacing:-.05em}
.svc .txt p{margin:0;color:var(--ink-2);max-width:48ch}
.svc .num{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.svc .note{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding-top:16px;border-top:1px solid var(--line)}
.pcard{display:flex;flex-direction:column;justify-content:space-between;gap:40px;background:var(--dark);color:var(--on-dark);padding:clamp(24px,3vw,40px);min-height:min(440px,62vh)}
.pcard .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pcard .badge{width:52px;height:52px;display:grid;place-items:center;background:var(--grad);font-family:var(--f-mono);font-size:14px;color:#fff;border-radius:14px}
.pcard .top span{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--on-dark-2)}
.pcard h3{font-size:clamp(32px,4vw,58px);font-weight:700;letter-spacing:-.05em;line-height:.98}
.pcard p{margin:14px 0 0;color:var(--on-dark-2);max-width:52ch}
.proc-head{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:30px;align-items:end;margin-bottom:clamp(36px,5vw,64px)}
.proc-head h2{font-size:clamp(46px,8vw,120px);font-weight:700;letter-spacing:-.065em;line-height:.88}
.proc-head p{margin:0;font-size:clamp(17px,1.6vw,21px);line-height:1.4;font-weight:500;letter-spacing:-.01em}

/* generated art */
.art{position:absolute;inset:0;overflow:hidden;background:var(--c0)}
.art::before,.art::after{content:"";position:absolute;inset:-30%}
.art::before{background:radial-gradient(closest-side at 28% 30%,var(--c1),transparent);animation:drift 12s ease-in-out infinite}
.art::after{background:radial-gradient(closest-side at 74% 76%,var(--c2),transparent);animation:drift 15s ease-in-out infinite reverse}
.art .sph{position:absolute;width:30%;aspect-ratio:1;right:14%;top:16%;border-radius:50%;z-index:1;background:radial-gradient(circle at 32% 28%,#fff 0 6%,var(--c1) 34%,var(--c3) 100%);box-shadow:inset -10px -14px 26px rgba(0,0,0,.16),0 26px 44px -20px rgba(0,0,0,.35);animation:float 9s ease-in-out infinite}
.art .ring{position:absolute;width:44%;aspect-ratio:1;left:-8%;bottom:-14%;border-radius:50%;border:18px solid rgba(255,255,255,.55);z-index:1;animation:float 11s ease-in-out infinite reverse}
.art .ttl{position:absolute;left:6%;bottom:7%;right:36%;z-index:2;font-family:var(--f-display);font-weight:800;font-size:clamp(26px,4vw,64px);letter-spacing:-.06em;line-height:.9;color:#0E0E10}
@keyframes drift{50%{transform:translate(7%,9%) scale(1.08)}}
@keyframes float{50%{transform:translateY(-14px)}}

/* ---------- WORK (dark blur reel) ---------- */
.dark{background:var(--dark);color:var(--on-dark)}
.work .shead p{color:var(--on-dark-2)}
.work-top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.work-top .count{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.shots{display:grid;gap:clamp(60px,10vw,140px);margin-top:clamp(40px,6vw,80px)}
.shot{display:block;width:100%;border:0;padding:0;background:none;color:inherit;text-align:left;cursor:pointer}
.shot .meta{display:flex;justify-content:space-between;gap:12px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}
.shot .meta span em{font-style:normal;color:var(--on-dark-2);margin-right:8px;font-weight:500}
.shot .img{position:relative;aspect-ratio:16/9;overflow:hidden;will-change:filter,transform;transition:filter .15s linear}
.shot .img>*{transition:transform 1.4s var(--ease)}
.shot:hover .img>*{transform:scale(1.04)}
.shot .img img{width:100%;height:100%;object-fit:cover}
.shot .bot{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:16px}
.shot h3{font-family:var(--f-body);font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.shot .go{display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--on-dark-2);transition:color .3s}
.shot .go i{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line-d);transition:background .4s,border-color .4s,transform .6s var(--ease)}
.shot:hover .go{color:var(--on-dark)}
.shot:hover .go i{background:#fff;color:var(--ink);transform:rotate(-45deg)}
.shot .sum{color:var(--on-dark-2);margin:8px 0 0;max-width:60ch;font-size:15px}

@keyframes mq{to{transform:translateX(-50%)}}

/* ---------- FAQ ---------- */
.faq{border-top:1px solid var(--line)}
.qa{border-bottom:1px solid var(--line)}
.qa button{width:100%;display:grid;grid-template-columns:44px minmax(0,1fr) 30px;gap:12px;align-items:center;padding:24px 0;background:none;border:0;cursor:pointer;text-align:left}
.qa button span:first-child{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.qa button b{font-family:var(--f-display);font-weight:600;font-size:clamp(18px,2vw,24px);letter-spacing:-.03em;line-height:1.25}
.qa .pm{width:30px;height:30px;display:grid;place-items:center;transition:transform .5s var(--ease)}
.qa.open .pm{transform:rotate(45deg)}
.qa .ans{display:grid;grid-template-rows:0fr;transition:grid-template-rows .6s var(--ease)}
.qa.open .ans{grid-template-rows:1fr}
.qa .ans>div{overflow:hidden}
.qa .ans p{margin:0;padding:0 40px 26px 56px;color:var(--ink-2);max-width:72ch}

/* ---------- BIG REVEAL ---------- */
.reveal{position:relative;height:170vh}
.reveal .sticky{position:sticky;top:0;height:100vh;display:grid;place-items:center;overflow:hidden}
.reveal .blk{position:absolute;inset:0;background:var(--grad);clip-path:inset(var(--ci,30%) var(--cx,30%) round var(--cr,24px));display:grid;place-items:center;text-align:center;color:#fff;padding:24px}
.reveal .blk::after{content:"";position:absolute;inset:0;opacity:.25;mix-blend-mode:soft-light;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.reveal .blk>div{position:relative;z-index:1;transform:scale(var(--ts,.8));display:grid;gap:22px;justify-items:center}
.reveal h2{font-size:clamp(46px,9vw,140px);font-weight:800;letter-spacing:-.065em;line-height:.88;max-width:12ch}
.reveal .scr{font-family:var(--f-script);font-size:clamp(40px,6vw,90px);line-height:.8;margin-top:-.2em}
.reveal a{display:inline-flex;align-items:center;gap:12px;background:#fff;color:var(--ink);height:56px;padding:0 24px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}

/* ---------- CONTACT ---------- */
.contact .big{font-size:clamp(48px,10vw,160px);font-weight:800;letter-spacing:-.07em;line-height:.86;margin:24px 0 0}
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:clamp(40px,6vw,70px)}
.citem{border:1px solid var(--line);padding:22px;display:grid;gap:30px;background:var(--bg);cursor:pointer;text-align:left;transition:background .4s,color .4s}
.citem:hover{background:var(--ink);color:#fff}
.citem span{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.citem b{font-family:var(--f-display);font-weight:600;font-size:clamp(18px,1.8vw,24px);letter-spacing:-.03em;overflow-wrap:anywhere}
.socials{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.socials a{padding:12px 18px;border:1px solid var(--line);font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;transition:background .3s,color .3s}
.socials a:hover{background:var(--ink);color:#fff}
.fmq{overflow:hidden;margin-top:clamp(60px,9vw,120px);padding-block:10px}
.fmq .row{display:flex;gap:40px;width:max-content;animation:mq 30s linear infinite}
.fmq span{font-family:var(--f-display);font-weight:800;font-size:clamp(60px,12vw,190px);letter-spacing:-.07em;line-height:1;white-space:nowrap;display:flex;align-items:center;gap:40px}
.fmq span::after{content:"";width:.28em;height:.28em;background:var(--grad);border-radius:50%}
.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:24px calc(100px + env(safe-area-inset-bottom,0px));font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line)}

/* ---------- MODAL ---------- */
.modal{position:fixed;inset:0;z-index:150;background:rgba(14,14,16,0);visibility:hidden;transition:background .5s,visibility 0s .7s;display:grid;align-items:end;justify-items:center;padding-top:calc(18px + env(safe-area-inset-top,0px))}
.modal.open{background:rgba(14,14,16,.55);visibility:visible;transition:background .5s}
.msheet{width:min(1100px,100%);max-height:calc(100vh - 18px - env(safe-area-inset-top,0px));overflow:auto;overscroll-behavior:contain;background:var(--bg);transform:translateY(100%);transition:transform .8s var(--ease);padding-bottom:env(safe-area-inset-bottom,0px)}
.modal.open .msheet{transform:none}
.mh{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px max(18px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px));background:rgba(255,255,255,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.mx{width:46px;height:46px;border:0;background:var(--ink);color:#fff;cursor:pointer;display:grid;place-items:center}
.mb{padding:clamp(20px,3vw,40px) max(18px,env(safe-area-inset-right,0px)) clamp(30px,4vw,50px) max(18px,env(safe-area-inset-left,0px));display:grid;gap:clamp(24px,3vw,40px)}
.mb h2{font-size:clamp(38px,6vw,84px);font-weight:700;letter-spacing:-.06em;line-height:.92}
.mb .sum{font-size:clamp(17px,1.6vw,21px);color:var(--ink-2);margin:14px 0 0;max-width:56ch}
.mcover{position:relative;aspect-ratio:16/8;overflow:hidden}
.mcover img{width:100%;height:100%;object-fit:cover}
.mcover .ttl{display:none}
.mfacts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line)}
.mfacts div{padding:16px 14px 16px 0;display:grid;gap:4px;border-bottom:1px solid var(--line)}
.mfacts div+div{padding-left:14px;border-left:1px solid var(--line)}
.mfacts span{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,4vw,60px)}
.mcols h5,.mres h5{margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mcols p{margin:0 0 22px;color:var(--ink-2)}
.mcols ol{margin:0;padding:0;list-style:none;counter-reset:a;display:grid;gap:12px}
.mcols li{counter-increment:a;display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;color:var(--ink-2)}
.mcols li::before{content:counter(a,decimal-leading-zero);font-family:var(--f-mono);font-size:12px;color:var(--g1);padding-top:3px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.kpi{background:var(--dark);color:var(--on-dark);padding:22px;display:grid;gap:30px}
.kpi b{font-family:var(--f-display);font-weight:700;font-size:clamp(40px,4vw,60px);letter-spacing:-.06em;line-height:1}
.kpi span{font-size:14px;color:var(--on-dark-2)}
.msec{display:grid;gap:14px}
.msec>h5{margin:0;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.vids{display:grid;gap:18px}
.vid{margin:0;display:grid;gap:10px}
.vbox{position:relative;aspect-ratio:16/9;background:var(--dark);overflow:hidden}
.vbox iframe,.vbox video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.vbox video{object-fit:contain}
.vph{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;color:#fff;text-align:center;padding:20px;background:var(--grad)}
.vph i{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-style:normal;font-size:20px}
.vph b{font-family:var(--f-display);font-size:clamp(18px,2vw,24px);font-weight:600;letter-spacing:-.03em}
.vph small{opacity:.85;font-size:13px;max-width:36ch}
.vid figcaption{font-size:14px;color:var(--ink-2);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.vid figcaption a{text-decoration:underline;text-underline-offset:3px}
.deliv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.dv{border:1px solid var(--line);display:flex;flex-direction:column;background:var(--bg)}
.dv .media{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--bg-2)}
.dv .media>img{width:100%;height:100%;object-fit:cover}
.dv .media .vbox{position:absolute;inset:0;aspect-ratio:auto}
.dv .t{padding:18px 18px 20px;display:grid;gap:6px}
.dv .t span{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.dv .t b{font-family:var(--f-display);font-size:20px;font-weight:600;letter-spacing:-.03em;line-height:1.2}
.dv .t p{margin:0;color:var(--ink-2);font-size:15px}
.ph-art{position:absolute;inset:0;background:radial-gradient(closest-side at 25% 30%,var(--c1),transparent),radial-gradient(closest-side at 75% 75%,var(--c2),transparent),var(--c0);display:grid;place-items:center}
.ph-art em{font-style:normal;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(14,14,16,.6);background:rgba(255,255,255,.6);padding:6px 10px}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.gal figure{margin:0;display:grid;gap:8px}
.gal .gi{border:0;padding:0;position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--bg-2);display:block;width:100%;cursor:zoom-in}
.gal .gi.ph{cursor:default}
.gal .gi img{width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease)}
.gal .gi:hover img{transform:scale(1.04)}
.gal figcaption{font-size:13px;color:var(--muted)}
.lb{position:fixed;inset:0;z-index:180;background:rgba(10,10,12,.94);display:grid;grid-template-columns:56px minmax(0,1fr) 56px;align-items:center;gap:8px;padding:calc(64px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));opacity:0;visibility:hidden;transition:opacity .4s,visibility 0s .4s}
.lb.open{opacity:1;visibility:visible;transition:opacity .4s}
.lb figure{margin:0;display:grid;gap:12px;justify-items:center;min-width:0}
.lb img{max-width:100%;max-height:calc(100vh - 160px);object-fit:contain;transform:scale(.96);transition:transform .6s var(--ease)}
.lb.open img{transform:none}
.lb figcaption{color:#D4D4D8;font-size:14px;text-align:center}
.lb button{width:48px;height:48px;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;cursor:pointer;display:grid;place-items:center;font-size:18px}
.lb button:hover{background:#fff;color:#0E0E10}
.lb .lbx{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px))}
.tli .org{display:flex;align-items:center;gap:8px}
.tli .org img{width:26px;height:26px;object-fit:contain;border-radius:6px;background:var(--bg)}
.pts{margin:12px 0 0;padding:0;list-style:none;display:flex;gap:6px;flex-wrap:wrap}
.pts li{font-size:13px;padding:6px 10px;background:var(--bg-2)}
#education .pts li{background:var(--bg)}
.skills-title{margin:clamp(50px,6vw,80px) 0 0;font-size:clamp(28px,3vw,40px);font-weight:700;letter-spacing:-.05em}
.skills-title+.skills2{margin-top:24px}
.mg{display:grid;gap:10px;margin:calc(-1 * clamp(20px,3vw,40px)) calc(-1 * max(18px,env(safe-area-inset-right,0px))) 0}
.mg-stage{position:relative;aspect-ratio:16/9;max-height:72vh;width:100%;background:#0E0E10;overflow:hidden;touch-action:pan-y}
.mg-slide{position:absolute;inset:0;display:grid;place-items:center;animation:mgIn .7s var(--ease)}
.mg-slide>img{width:100%;height:100%;object-fit:contain;cursor:zoom-in}
.mg-slide>.vbox{position:absolute;inset:0;aspect-ratio:auto}
.mg-slide>.ph-art{position:absolute;inset:0}
@keyframes mgIn{from{opacity:0;transform:scale(1.03)}}
.mg-nav{position:absolute;top:50%;z-index:3;width:46px;height:46px;margin-top:-23px;border:0;background:rgba(255,255,255,.92);color:#0E0E10;display:grid;place-items:center;cursor:pointer;transition:transform .4s var(--ease),background .3s}
.mg-nav:hover{background:#fff;transform:scale(1.08)}
.mg-nav.p{left:14px}.mg-nav.n{right:14px}
.mg-count{position:absolute;left:14px;top:14px;z-index:3;padding:6px 10px;background:rgba(14,14,16,.72);color:#fff;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;pointer-events:none}
.mg-kind{position:absolute;right:14px;top:14px;z-index:3;padding:6px 10px;background:rgba(255,255,255,.9);color:#0E0E10;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;pointer-events:none}
.mg-cap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:0 max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px));font-size:14px;color:var(--ink-2);min-height:1.4em}
.mg-cap a{text-decoration:underline;text-underline-offset:3px}
.mg-thumbs{display:flex;gap:8px;overflow-x:auto;padding:2px max(18px,env(safe-area-inset-right,0px)) 6px max(18px,env(safe-area-inset-left,0px));scrollbar-width:thin}
.mg-thumbs button{flex:none;width:118px;aspect-ratio:16/10;border:0;padding:0;position:relative;overflow:hidden;background:var(--bg-2);cursor:pointer;opacity:.55;outline:2px solid transparent;outline-offset:-2px;transition:opacity .3s,outline-color .3s}
.mg-thumbs button:hover{opacity:.85}
.mg-thumbs button[aria-current="true"]{opacity:1;outline-color:var(--ink)}
.mg-thumbs img,.mg-thumbs video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.mg-thumbs .ph-art em{font-size:9px;padding:3px 5px}
.mg-thumbs .pl{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:16px;background:linear-gradient(transparent 40%,rgba(14,14,16,.45));pointer-events:none}
.mg-thumbs .pl.only{background:var(--grad)}
/* keep the line breaks typed in the editor */
.hint,.shead p,.lead,.kv b,.shot .sum,.mb .sum,.mcols p,.mcols li,.dv .t p,.svc .txt p,.pts li,.mg-cap span,.tli .when,.reveal h2,.contact .big,.citem b{white-space:pre-line}
.rich{display:grid;gap:8px}
.rich p{margin:0;white-space:pre-line}
.rich ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.rich li{position:relative;padding-left:18px}
.rich li::before{content:"";position:absolute;left:2px;top:.68em;width:6px;height:6px;border-radius:50%;background:var(--grad)}
.tli .rich{margin-top:10px;color:var(--ink-2);max-width:62ch;font-size:15px}
.mcols.one{grid-template-columns:minmax(0,1fr);max-width:820px}
.mnav{display:justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:20px}

.toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);z-index:210;background:var(--ink);color:#fff;padding:12px 18px;font-size:14px;font-weight:500;transition:transform .5s var(--ease);max-width:calc(100vw - 32px)}
.toast.on{transform:translate(-50%,0)}

/* reveal on scroll (visible at rest; below-the-fold items glide up) */
.rv{transition:transform 1.2s var(--ease)}
.rv.pre{transform:translateY(50px)}

/* cursor */
.cur{position:fixed;left:0;top:0;z-index:300;pointer-events:none;display:none;mix-blend-mode:difference}
.cur i{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;transition:width .4s var(--ease),height .4s var(--ease),margin .4s var(--ease)}
.cur.big i{width:70px;height:70px;margin:-35px 0 0 -35px}
.cur span{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#000;opacity:0;transition:opacity .3s;white-space:nowrap}
.cur.big span{opacity:1}
@media (hover:hover) and (pointer:fine){.cur{display:block}}

/* ---------- RESPONSIVE ---------- */
@media (max-width:900px){
  .hbottom,.about-grid,.proc-head,.mcols{grid-template-columns:1fr}
  .svc{grid-template-columns:1fr;min-height:0}
  .svc .vis{aspect-ratio:16/10;min-height:0}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .voices{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:min(82%,360px);overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
  .voice{scroll-snap-align:start}
  .cgrid{grid-template-columns:1fr}
  .lb{grid-template-columns:44px minmax(0,1fr) 44px}
  .lb button{width:42px;height:42px}
  .mfacts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mfacts div:nth-child(3){padding-left:0;border-left:0}
  .shot .img{aspect-ratio:4/5}
  .skills2{grid-template-columns:1fr}
}
@media (max-width:560px){
  .inner{padding-inline:12px}
  .htags{grid-template-columns:1fr 1fr}
  .htags div:nth-child(3){display:none}
  .htags div:nth-child(2){text-align:right}
  .script{left:12%;top:52%}
  .tli{grid-template-columns:1fr;gap:6px;padding:24px 0 24px 26px}

/* ---- particle wave ---- */
(function () {

  const stops = ((C.hero.style && C.hero.style.gradient) || T.gradient || ["#6A5CFF", "#A866FF", "#FF6FA8", "#FFA978"]).map(hex); if (stops.length < 2) stops.push(stops[0]);
  const colAt = x => { const s = x * (stops.length - 1), i = Math.min(stops.length - 2, Math.floor(s)), f = s - i, a = stops[i], b = stops[i + 1]; return a.map((v, k) => Math.round(v + (b[k] - v) * f)); };

        const sx = W / 2 + (x / z) * (W / 9) * fov * 1.15;

})();

/* ---- scroll-driven effects ---- */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const words = $$("#statement .w"), stEl = $("#statement");
const tlxs = $$(".tlx");
const shots = $$(".shot .img");
const stacks = [$$("#svcStack .scard")];
const revSec = $("#cta"), blk = $("#blk");

const desktop = () => innerWidth > 900;
let ticking = false;
function frame() {
  ticking = false; const vh = innerHeight;
  if (!reduce) {
    // statement words light up
    const r = stEl.getBoundingClientRect(), p = clamp((vh * .9 - r.top) / (r.height + vh * .45), 0, 1), lit = Math.floor(p * words.length * 1.05);
    words.forEach((w, i) => w.classList.toggle("dim", i >= lit));
    // timeline rail
    tlxs.forEach(tl => {
      const tr = tl.getBoundingClientRect(); if (!tr.height) return;
      tl.querySelector(".rail i").style.transform = `scaleY(${clamp((vh * .62 - tr.top) / tr.height, 0, 1)})`;
      tl.querySelectorAll(".tli").forEach(li => { const on = li.getBoundingClientRect().top < vh * .62; li.classList.toggle("on", on); li.classList.toggle("pre", !on); });
    });
    // stacked cards shrink as the next one arrives
    stacks.forEach(cards => cards.forEach((c, i) => {
      const nx = cards[i + 1]; if (!nx) { c.style.transform = ""; c.style.filter = ""; return; }
      const nr = nx.getBoundingClientRect(), top = parseFloat(getComputedStyle(nx).top) || 0;
      const k = clamp((vh - nr.top) / (vh - top), 0, 1);
      c.style.transform = `scale(${1 - k * .06})`; c.style.filter = `brightness(${1 - k * .25})`;
    }));
    // project images: sharp at centre, blurred towards edges
    shots.forEach(s => {
      const b = s.getBoundingClientRect(); if (b.bottom < -200 || b.top > vh + 200) return;
      const d = Math.abs((b.top + b.height / 2) - vh / 2) / vh, k = clamp((d - .12) / .5, 0, 1);
      s.style.filter = `blur(${(k * 16).toFixed(1)}px)`; s.style.transform = `scale(${(1 + k * .06).toFixed(3)})`; s.style.opacity = (1 - k * .45).toFixed(2);
    });
    // gradient block grows
    const rr = revSec.getBoundingClientRect(), rp = clamp(-rr.top / (revSec.offsetHeight - vh) , 0, 1), e = 1 - Math.pow(1 - clamp(rp * 1.35, 0, 1), 3);
    blk.style.setProperty("--ci", ((1 - e) * 26).toFixed(2) + "%"); blk.style.setProperty("--cx", ((1 - e) * (desktop() ? 30 : 8)).toFixed(2) + "%"); blk.style.setProperty("--cr", ((1 - e) * 28).toFixed(1) + "px"); blk.style.setProperty("--ts", (.82 + e * .18).toFixed(3));
  }
  // dock
  const hb = heroEl.getBoundingClientRect().bottom, ct = contactEl.getBoundingClientRect().top;
  dock.classList.toggle("on", hb < vh * .3 && ct > vh * .7 && !menu.classList.contains("open"));
}

        d.append(sm, inner); list.append(d);
      } else {
        const row = ce("div", "ed-row"), f = field(ip); f.style.flex = "1"; f.style.minWidth = "0"; row.append(f, ctl(i)); list.append(row);
      }
    });
    const add = ce("button", "ed-btn add", "+ Thêm"); add.type = "button";
    add.addEventListener("click", () => { arr.push(newItem(p, arr)); openSet.add(p.concat(arr.length - 1).join(".")); dirty(); renderTab(tab); });
    w.append(add); return w;
  }

  /* ---------- page source (rebuilt from its own parts + the new CONFIG) ---------- */
  const RESET = ":root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}";
  function buildDoc(cfg) {
    const safe = s => s.replace(/<\/(script)/gi, "<\\/$1");
    const json = JSON.stringify(cfg, null, 2).replace(/<\//g, "<\\/").replace(/\u2028/g, "\\u2028").replace(/\u2029/g, "\\u2029");
    const head = document.getElementById("pf-head").innerHTML.trim();
    return "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>" + RESET + "</style></head><body>" +
      "<title>" + document.title.replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</title>\n" + head + "\n" +
      "<style id=\"css\">" + document.getElementById("css").textContent + "</style>\n" +
      "<template id=\"shell\">" + document.getElementById("shell").innerHTML + "</template>\n" +
      "<template id=\"pf-head\">" + head + "</template>\n" +
      "<script id=\"cfg\">\nvar CONFIG = " + json + ";\n<\/script>\n" +
      "<script id=\"engine\">" + safe(document.getElementById("engine").textContent) + "<\/script>\n" +
      "<script id=\"editor\">" + safe(document.getElementById("editor").textContent) + "<\/script>\n</body></html>";
  }
  window.__buildDoc = () => buildDoc(draft);

  async function save() {
    if (!isDirty()) { status("Chưa có thay đổi để lưu"); return; }
    status("Đang lưu…");
    saveDraft(); ss.set(OK, tab);
    try {
      await ART.publish(buildDoc(draft));
      ss.del(DK); ss.del(PK);
      status("Đã xuất bản, đang tải lại…");
    } catch (e) {
      const c = e && e.code;
      if (c === "conflict") status("Trang vừa được cập nhật ở nơi khác. Đang tải lại, bản nháp vẫn được giữ.", "err");
      else if (c === "not_writer" || c === "not_granted" || c === "not_declared") { status("Tài khoản này không có quyền sửa trang", "err"); ss.del(OK); }
      else if (c === "too_large") status("Trang quá lớn. Hãy dùng ảnh tải lên thay vì dán ảnh trực tiếp", "err");
      else if (c === "rate_limited") status("Lưu quá nhanh, đợi một chút rồi thử lại", "err");
      else status("Chưa lưu được, thử lại sau ít phút", "err");
      if (c !== "conflict") ss.del(OK);
    }
  }
  function preview() { saveDraft(); ss.set(PK, "1"); ss.set(OK, tab); location.reload(); }
  function discard() { if (!isDirty() && !window.__PREVIEW) { status("Chưa có thay đổi"); return; } ss.del(DK); ss.del(PK); ss.set(OK, tab); location.reload(); }
  async function download() {
    if (!DL) return;
    try { await DL.save({ filename: "index.html", data: buildDoc(draft) }); status("Đã tải file. Ảnh, video tải lên chỉ hiển thị trên trang Claude"); }
    catch (e) { if (e && e.code !== "declined") status("Chưa tải được file", "err"); }
  }

  /* ---------- only the owner gets the editor ---------- */
  (async function () {
    let user = null; try { user = await window.claude.use("user"); } catch (e) {}
    let owner = false;
    if (user) { try { owner = (await user.isOwner()) || (await user.canEdit()); } catch (e) {} }
    if (!owner) { if (window.__PREVIEW) { ss.del(PK); location.reload(); } return; }
    try { ART = await window.claude.use("artifact"); } catch (e) {}
    if (!ART) return;
    try { ASSETS = await window.claude.use("assets"); } catch (e) {}
    try { DL = await window.claude.use("downloads"); } catch (e) {}
    mount();
  })();
})();
</script>
</body></html>
